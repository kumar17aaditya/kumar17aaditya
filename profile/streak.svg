    }
  </style>

  <text x="25" y="38" class="header">Contribution Activity</text>

  <line x1="165" y1="66" x2="165" y2="238" class="line"/>
  <line x1="330" y1="66" x2="330" y2="238" class="line"/>

  <text x="82" y="140" text-anchor="middle" class="number">
