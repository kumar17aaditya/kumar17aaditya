<svg
  width="495"
  height="272"
  viewBox="0 0 495 272"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect width="495" height="272" rx="6" fill="#1a1b27"/>

  <style>
    .header {
      font: 600 20px Arial, sans-serif;
      fill: #70a5fd;
    }

    .number {
