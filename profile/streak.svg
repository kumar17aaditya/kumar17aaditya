<svg
  width="495"
  height="272"
  viewBox="0 0 495 272"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect width="495" height="272" rx="6" fill="#1a1b27"/>

  <style>
    .number {
      font: 700 32px Arial, sans-serif;
