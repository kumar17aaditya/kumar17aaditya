    }

    .line {
      stroke: #8b949e;
      stroke-width: 1;
    }

  </style>


  <!-- ================================================ -->
  <!-- DIVIDERS                                         -->
  <!-- ================================================ -->


  <line
    x1="165"
    y1="25"
    x2="165"
    y2="170"
